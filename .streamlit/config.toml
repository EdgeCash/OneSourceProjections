# Default is the cool near-black DARK look (go-live). A theme toggle on the
# landing page / sidebar swaps to the Cream light palette at runtime via CSS.
[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e8eef5"
linkColor = "#6cb6ff"
# Shape + borders for the clean editorial look (Streamlit >= 1.50).
baseRadius = "0.4rem"
borderColor = "#2a3441"
showWidgetBorder = true
# Dark-theme every st.dataframe header/border without touching call sites.
dataframeHeaderBackgroundColor = "#1c2431"
dataframeBorderColor = "#2a3441"

# The sidebar reads as app chrome (deep near-black).
[theme.sidebar]
backgroundColor = "#111722"
secondaryBackgroundColor = "#0d1117"
borderColor = "#2a3441"

[browser]
gatherUsageStats = false

[server]
headless = true

[client]
# Show full tracebacks inline instead of the redacted "error message hidden"
# card — this is a private, auth-gated analytics tool and we need to see failures
# to fix them. Set back to "none" if the app is ever exposed publicly.
showErrorDetails = "full"
