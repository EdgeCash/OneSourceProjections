# 360Five — the pure-black "Terminal" look is the go-live default; a theme
# toggle swaps to the warm almanac-paper "cream" palette at runtime via CSS.
# Copper is the single brand accent (matching the Sharp Sheet cards); green/red
# are reserved for meaning (money on / off). Keep these in sync with
# _PALETTES["dark"] in app/dashboard.py.
[theme]
base = "dark"
primaryColor = "#F5B841"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0a0a0a"
textColor = "#EAEAEA"
linkColor = "#3d9fff"
# Shape + borders for the clean terminal look (Streamlit >= 1.50).
baseRadius = "0.4rem"
borderColor = "#1f1f1f"
showWidgetBorder = true
# Dark-theme every st.dataframe header/border without touching call sites.
dataframeHeaderBackgroundColor = "#141414"
dataframeBorderColor = "#1f1f1f"

# The sidebar reads as app chrome (deepest black).
[theme.sidebar]
backgroundColor = "#050505"
secondaryBackgroundColor = "#000000"
borderColor = "#1f1f1f"

[browser]
gatherUsageStats = false

[server]
headless = true

[client]
# Show full tracebacks inline instead of the redacted "error message hidden"
# card — this is a private, auth-gated analytics tool and we need to see failures
# to fix them. Set back to "none" if the app is ever exposed publicly.
showErrorDetails = "full"
