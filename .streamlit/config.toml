# Default theme is LIGHT (Project 54.7 default); a Night-mode toggle on the
# landing page / sidebar swaps to the dark palette at runtime via injected CSS.
[theme]
base = "light"
primaryColor = "#00a352"
backgroundColor = "#f6f8fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0e1726"

[browser]
gatherUsageStats = false

[server]
headless = true
