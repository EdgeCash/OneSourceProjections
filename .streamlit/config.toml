# 360Five — the petrol-ink "dark" look is the go-live default; a theme toggle
# swaps to the warm almanac-paper "cream" palette at runtime via CSS. Brass is
# the single brand accent; green/red are reserved for meaning (money on / off).
[theme]
base = "dark"
primaryColor = "#d3ac57"
backgroundColor = "#0a1216"
secondaryBackgroundColor = "#0f1b21"
textColor = "#e8f0f0"
linkColor = "#6cc4dd"
# Shape + borders for the clean editorial look (Streamlit >= 1.50).
baseRadius = "0.4rem"
borderColor = "#1e333c"
showWidgetBorder = true
# Dark-theme every st.dataframe header/border without touching call sites.
dataframeHeaderBackgroundColor = "#14242c"
dataframeBorderColor = "#1e333c"

# The sidebar reads as app chrome (deepest petrol ink).
[theme.sidebar]
backgroundColor = "#0c171c"
secondaryBackgroundColor = "#080f13"
borderColor = "#1e333c"

[browser]
gatherUsageStats = false

[server]
headless = true

[client]
# Show full tracebacks inline instead of the redacted "error message hidden"
# card — this is a private, auth-gated analytics tool and we need to see failures
# to fix them. Set back to "none" if the app is ever exposed publicly.
showErrorDetails = "full"
