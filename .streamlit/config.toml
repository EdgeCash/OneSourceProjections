# Default theme is CREAM / vintage (Project 54.7 calm look); a Night-mode toggle
# on the landing page / sidebar swaps to the dark palette at runtime via CSS.
[theme]
base = "light"
primaryColor = "#2f7a4a"
backgroundColor = "#f4ead0"
secondaryBackgroundColor = "#fbf5e6"
textColor = "#1f2328"
linkColor = "#8a1f2b"
# Shape + borders for the clean editorial look (Streamlit >= 1.50).
baseRadius = "0.4rem"
borderColor = "#d8ccab"
showWidgetBorder = true
# Cream-theme every st.dataframe header/border without touching call sites.
dataframeHeaderBackgroundColor = "#efe2c2"
dataframeBorderColor = "#d8ccab"

# The sidebar reads as app chrome (vintage cream).
[theme.sidebar]
backgroundColor = "#efe3c4"
secondaryBackgroundColor = "#f4ead0"
borderColor = "#1f2328"

[browser]
gatherUsageStats = false

[server]
headless = true
