[theme]
base = "dark"
# True Bill — the "Case File" docket palette (brass on warm near-black).
# The in-app theme toggle re-skins via CSS variables; these set the native
# Streamlit widget chrome to match the default (docket) brand.
primaryColor = "#c69a3f"
backgroundColor = "#0a0a0b"
secondaryBackgroundColor = "#16140f"
textColor = "#ece1cb"

[browser]
gatherUsageStats = false

[server]
headless = true
