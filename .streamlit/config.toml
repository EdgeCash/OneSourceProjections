# Default theme is DARK (Project 54.7 premium look); a Day-mode toggle on the
# landing page / sidebar swaps to the light palette at runtime via injected CSS.
[theme]
base = "dark"
primaryColor = "#00c46a"
backgroundColor = "#0a0e16"
secondaryBackgroundColor = "#121927"
textColor = "#e7ecf3"

[browser]
gatherUsageStats = false

[server]
headless = true
