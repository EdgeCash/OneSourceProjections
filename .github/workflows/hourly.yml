name: Hourly update

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Anchor date (YYYY-MM-DD), defaults to today ET"
        required: false
  schedule:
    # Game-time schedule to avoid burning BettingPros credits overnight. Times
    # are UTC; ET = UTC-4 (summer) / UTC-5 (winter), so the window shifts ~1h in
    # winter — fine, it's wide. No pulls in the dead of night (~2am-8am ET).
    # Scheduled runs only fire on the default branch, so this must be on main.
    - cron: "0 13,15,17 * * *"     # every 2h, ~9am-1pm ET — morning slate + tennis
    - cron: "0 18-23,0-5 * * *"    # hourly, ~2pm-1am ET — lineups, games, grading

# avoid overlapping runs racing on the same data files
concurrency:
  group: hourly-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hourly pull, project, snapshot, grade
        env:
          # Post-hoc probability calibration (docs/MODEL_REPAIR.md). "1" = ON.
          # Set to "0" or delete this line to turn calibration back off.
          APPLY_CALIBRATION: "1"
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          BP_PARTNER_KEY: ${{ secrets.BP_PARTNER_KEY }}
          BP_USER: ${{ secrets.BP_USER }}
          BP_USER_KEY: ${{ secrets.BP_USER_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python scripts/hourly_update.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      # Comparison pipeline (sports_wagering_pipeline/) — runs right after the
      # pull so it consumes the warm FantasyPros cache the step above populated.
      # No API secrets on purpose: the FantasyPros client only reads its key on a
      # cache MISS, so with no key this step can only read the cache — a second,
      # billable API call is structurally impossible. continue-on-error keeps it
      # from ever breaking the main data pipeline.
      - name: Comparison pipeline (reuses warm cache, no extra API calls)
        continue-on-error: true
        # No API secrets on purpose: this consumes the warm cache only, proving
        # the pipeline adds zero API calls on the hourly cadence.
        run: |
          pip install "pulp>=2.7"
          cd sports_wagering_pipeline
          for SPORT in MLB WNBA; do
            echo "===================== $SPORT ====================="
            PYTHONPATH=.. python -m src.app --mode both --sport "$SPORT" --source shared || true
          done

      - name: Daily ready-to-play workbook (Excel)
        continue-on-error: true
        # Built once per day (15:00 UTC run or a manual --date run). NO API
        # secrets on purpose: the BettingPros account's 5,000/day budget is the
        # binding constraint and the main engine's own hourly pull already
        # exhausts it by mid-day, so this step must NOT make its own BP/FP calls
        # and compete for a budget that's gone. Keyless => pure warm-cache
        # consumer: it gets whatever the main engine's pull above already
        # fetched (MLB props/offers) and adds zero external load. openpyxl comes
        # from the root requirements; no Google Cloud, no Sheets secrets.
        run: |
          # Build right after THIS run pulled player props, so BettingPros' short
          # (~10 min) prop cache is still warm for this keyless step. Props are
          # pulled ~4x/day (see PROPS_MIN_GAP_HOURS: ET ~9/13/17/21), and we
          # rebuild the sheet on each so it always reflects the latest lines —
          # the evening pull gives the final pre-game board. Freshness is read
          # from the prop-pull marker the Hourly pull step just wrote (robust to
          # scheduler jitter — no exact-hour gate).
          FRESH=$(python3 -c "import json,datetime;m=json.load(open('data/history/prop_pull_state.json'));last=datetime.datetime.fromisoformat(m['last_pull_utc']);now=datetime.datetime.now(datetime.timezone.utc);print('1' if (now-last).total_seconds()<=900 else '0')" 2>/dev/null || echo 0)
          if [ "$FRESH" = "1" ] || [ -n "${{ inputs.date }}" ]; then
            cd sports_wagering_pipeline
            echo "building ready-to-play workbook (props just pulled; BP cache warm)"
            PYTHONPATH=.. python -m src.export --daily --source shared \
              --out data/output/latest.xlsx --json data/output/latest.json || true
          else
            echo "no fresh prop pull this run (BP cache cold); skipping workbook build"
          fi

      - name: Commit data
        run: |
          git config user.name "projections-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          # data/history/backfill carries the MLB season game log that the
          # daily refresh (_maybe_refresh_mlb_backfill) extends from statsapi.
          # It MUST be staged or the refreshed games.json.gz is discarded each
          # run while the (committed) dedup state falsely records success — which
          # silently froze the MLB game log at the import cutoff (staleness bug).
          git add data/output data/history/snapshots data/history/playerlogs data/history/markets data/history/fantasypros data/history/tracking data/history/backfill data/track data/history/prop_pull_state.json
          # daily comparison workbook + growing picks/game history (built once/day)
          git add sports_wagering_pipeline/data/output/latest.xlsx sports_wagering_pipeline/data/output/latest.json sports_wagering_pipeline/data/output/picks_history.jsonl sports_wagering_pipeline/data/output/game_history.jsonl
          git diff --cached --quiet || git commit -m "data: hourly update $(date -u +'%F %H:%MZ')"
          git push
