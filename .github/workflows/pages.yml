name: pages

# Build the static site from data/output/latest.json and publish to GitHub
# Pages. No secrets needed — the build is a pure transform of the
# already-committed JSON.
#
# IMPORTANT: the hourly + AI-curation jobs commit their data with the default
# GITHUB_TOKEN, and GitHub does NOT fire `push`-triggered workflows for commits
# made by GITHUB_TOKEN. So a `push` trigger alone would only ever deploy on
# human/PR pushes, leaving the live site frozen on stale data between merges.
# The `workflow_run` trigger below is what actually keeps the site fresh: it
# runs after those data workflows finish, regardless of who pushed. The `push`
# trigger remains for code/site changes landed by a person.
on:
  push:
    branches: [main]
    paths:
      - "data/output/latest.json"
      - "data/output/ai_curation.json"
      - "app/**"
      - "scripts/build_static.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Hourly update", "AI slate curation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys overlap; keep only the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build static site
        run: python scripts/build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
