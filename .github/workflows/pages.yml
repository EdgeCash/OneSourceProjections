name: pages

# Build the static site from data/output/latest.json and publish to GitHub
# Pages. Runs whenever the hourly data update (or the site code) lands on the
# default branch, and can be kicked off by hand. No secrets needed — the build
# is a pure transform of the already-committed JSON.
on:
  push:
    branches: [main]
    paths:
      - "data/output/latest.json"
      - "app/**"
      - "scripts/build_static.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys overlap; keep only the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build static site
        run: python scripts/build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
