name: Confirm BettingPros DFS books

# One-off helper to discover which book_id / name PrizePicks & Underdog use in
# the BettingPros props feed, so we can wire real DFS lines. Trigger manually
# from the GitHub mobile app / web: Actions -> "Confirm BettingPros DFS books"
# -> Run workflow (pick an in-season sport). It prints the book list to the run
# log AND commits data/history/raw/bp_books_<sport>_<date>.json to the branch.

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport with a live props board (MLB, WNBA, NBA, NFL)"
        required: false
        default: "MLB"

permissions:
  contents: write

concurrency:
  group: hourly-update      # don't race the hourly job on the data files
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dump BettingPros props book universe
        env:
          BP_PARTNER_KEY: ${{ secrets.BP_PARTNER_KEY }}
          BP_USER: ${{ secrets.BP_USER }}
          BP_USER_KEY: ${{ secrets.BP_USER_KEY }}
        run: python scripts/dump_bp_props.py "${{ inputs.sport }}"

      - name: Commit the book universe sample
        run: |
          git config user.name "projections-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add data/history/raw
          git diff --cached --quiet || git commit -m "dfs: BettingPros book universe (${{ inputs.sport }})"
          git push
